<script>
var P = JSON.parse(document.getElementById('payload').textContent);
var B = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
var LOOK = {'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X','У':'Y'};
var norm = s => s.trim().toUpperCase().replace(/[АВСЕНКМОРТХУ]/g, c => LOOK[c]);
async function openDoc(code) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: B(P.s), iterations: 200000, hash: 'SHA-256'},
                                            km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: B(P.i)}, key, B(P.c));
  const doc = new TextDecoder().decode(pt);
  try { sessionStorage.setItem(KEY, norm(code)); } catch (_) {}
  document.open(); document.write(doc); document.close();
}
var KEY = 'rost-code:' + (location.pathname.split('/')[1] || '');
try {
  var saved = sessionStorage.getItem(KEY);
  if (saved) openDoc(saved).catch(() => { try { sessionStorage.removeItem(KEY); } catch (_) {} });
} catch (_) {}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try { await openDoc(document.getElementById('pw').value); }
  catch (_) { err.textContent = 'Код не подошёл. Проверьте буквы и цифры.'; }
});
</script>
