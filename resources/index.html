<script>
var P = JSON.parse(document.getElementById('payload').textContent);
var B = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

var norm = s => s.trim().toUpperCase().replace(/[АВСЕНКМОРТХУ]/g, c => LOOK[c]);
async function openDoc(code) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: B(P.s), iterations: 200000, hash: 'SHA-256'},
                                            km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: B(P.i)}, key, B(P.c));
